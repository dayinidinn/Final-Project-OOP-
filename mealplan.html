
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EasyCook - My Meal Plans</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
        <div class="brand">
            <h1>🍽️ My Meal Plans</h1>
            <p>Plan your meals and keep everything organised.</p>
        </div>
    </header>

    <div class="section">
        <h2>Add a Meal Plan</h2>
        <p>Enter your meal details below.</p>

        <div class="meal-form">
            <label for="mealName">Meal Name</label>
            <input type="text" id="mealName"
                   placeholder="e.g. Chicken Pasta">

            <label for="mealDate">Meal Date</label>
            <input type="date" id="mealDate">

            <button id="saveBtn">Save Meal Plan</button>
        </div>

        <p id="message" aria-live="polite"></p>
    </div>

    <div class="section">
        <h2>Saved Meal Plans</h2>
        <p>View, edit or delete your saved meals.</p>

        <div id="savedMeals"></div>
    </div>

    <script src="mealplan.js"></script>
</body>
</html>
